name: Deploy Migrations

# Keeps the production Supabase schema in lockstep with merged code.
#
# Linear O-62 post-mortem: code querying rounds.frozen_tiles_before reached
# Vercel while the migration adding the column never reached production,
# hanging every match at round 1 resolution. It happened again on 2026-09-15
# with matches.rated (spec 045), because this workflow was failing silently —
# first for a missing project ref, then for a rejected access token — and
# nothing watches a workflow that only runs on migration pushes.
#
# It now connects straight to the database instead of going through
# `supabase link`. That drops the Management API, and with it the personal
# access token whose rejection blocked the last attempt: applying a migration
# only ever needed the database, never the project's control plane.
#
# Required repository secret:
#   SUPABASE_DB_URL — the production connection string, percent-encoded.
#
#     postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#
#   It must be the SESSION pooler on port 5432, for two reasons:
#     - db.<ref>.supabase.co resolves to IPv6 only, and GitHub runners are
#       IPv4 only, so the direct host is unreachable from here;
#     - the transaction pooler (6543) does not hold session state, and
#       migrations need advisory locks and multi-statement transactions.
#
#   Percent-encode the password: an @ or / in it silently truncates the URL
#   into something that points at the wrong host.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  deploy-migrations:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the connection string is configured
        # Fail with a sentence someone can act on, rather than an
        # "Unauthorized" from three layers down.
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it as a repository secret — the session pooler URL on port 5432, password percent-encoded. See the header of this file."
            exit 1
          fi

      - name: Show pending migrations
        # Before, not after: if the push fails, the log still says what it was
        # about to apply.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Confirm what is applied
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
